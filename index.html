<style>
  :root {
    --bg: #161616;
    --panel: #232323;
    --orange: #f58220;
    --text: #f5f5f5;
    --muted: #b5b5b5;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Cairo", "Segoe UI", Tahoma, Arial, sans-serif;
    min-height: 100vh;
  }
  header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--bg);
    padding: 12px 12px 0;
    border-bottom: 3px solid var(--orange);
  }
  h1 {
    text-align: center;
    font-size: 1.6rem;
    font-weight: 800;
    color: var(--orange);
    line-height: 1.3;
  }
  .tabs {
    display: flex;
    gap: 8px;
    margin-top: 10px;
    max-width: 640px;
    margin-inline: auto;
  }
  .tab {
    flex: 1;
    font: inherit;
    font-weight: 600;
    font-size: 0.95rem;
    padding: 10px 6px;
    background: var(--panel);

<script>
  var tabs = document.querySelectorAll('.tab');
  var pages = document.querySelectorAll('.page');

  function show(id) {
    tabs.forEach(function (t) {
      t.setAttribute('aria-selected', t.getAttribute('aria-controls') === id ? 'true' : 'false');
    });
    pages.forEach(function (p) {
      p.classList.toggle('active', p.id === id);
    });
    window.scrollTo(0, 0);
  }

  tabs.forEach(function (t) {
    t.addEventListener('click', function () {
      var id = t.getAttribute('aria-controls');
      show(id);
      history.replaceState(null, '', '#' + id);
    });
  });

  // فتح الصورة بحجمها الكامل في تاب جديد
  document.querySelectorAll('a[data-img]').forEach(function (a) {
    a.addEventListener('click', function (e) {
      e.preventDefault();
      var src = document.getElementById(a.getAttribute('data-img')).src;
      fetch(src).then(function (r) { return r.blob(); }).then(function (blob) {
        window.open(URL.createObjectURL(blob), '_blank');
      });
    });
  });

  // الرابط ينفع يفتح على تاب معين: ...#menu2
  var start = location.hash.replace('#', '');
  if (start === 'menu1' || start === 'menu2') show(start);
</script>
